# Supabase CLI 2.120.0 reference configuration. Keep this project separate from app databases.
project_id = "hackathon-kit-supabase-demo"

[api]
enabled = true
port = 56321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 56323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 56324

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3004"
additional_redirect_urls = ["http://127.0.0.1:3004/api/auth?action=callback", "http://localhost:3004/api/auth?action=callback"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true

[analytics]
enabled = false

[edge_runtime]
enabled = false
