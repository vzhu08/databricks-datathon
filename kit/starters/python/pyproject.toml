[project]
name = "hackathon-kit-python"
version = "0.1.0"
description = "Optional contract-validated FastAPI companion"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4.23,<5", "pydantic-settings>=2.6,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.optional-dependencies]
ocr = ["pillow>=11,<13", "pytesseract>=0.3.13,<1", "pypdfium2>=4.30,<6"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.uv]
package = false
